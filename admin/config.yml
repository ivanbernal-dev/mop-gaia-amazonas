# Configuración de Decap CMS — Fase 2 de la auditoría del módulo
# administrador del MOP (agosto 2026).
#
# Este archivo define QUÉ es editable desde /admin. Cada colección
# apunta a un archivo JSON en assets/data/; al guardar, Decap hace un
# commit directo a ese JSON, y el flujo
# .github/workflows/generar-datos-cms.yml regenera automáticamente el
# .js que el sitio realmente carga (ver tools/build-cms-data.js).
#
# base_url debe apuntar al pequeño servidor de autenticación que TI
# despliega siguiendo admin/README.md — sin eso, el botón de acceso no
# funciona. Con base_url vacío, Decap muestra un error claro en vez de
# fallar en silencio.

backend:
  name: github
  repo: ivanbernal-dev/mop-gaia-amazonas
  branch: main
  base_url: "https://mop-gaia-oauth.ivan-bernal.workers.dev"
  auth_endpoint: auth

# Antes de publicar, cada cambio queda como borrador visible solo para
# quien lo hizo, hasta que alguien con permiso lo aprueba — así ningún
# cambio llega al sitio público sin revisión.
publish_mode: editorial_workflow

media_folder: "assets/cms-uploads"
public_folder: "/assets/cms-uploads"

collections:
  - name: "novedades"
    label: "Novedades del MOP"
    description: "Lo que se muestra en la sección 'Esta semana en el MOP'."
    files:
      - file: "assets/data/mop-updates.json"
        label: "Novedades semanales"
        name: "novedades"
        fields:
          - label: "Semana actual"
            name: "currentWeek"
            widget: "object"
            fields:
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "Periodo", name: "period", widget: "string" }
              - { label: "Resumen", name: "summary", widget: "text" }
          - label: "Destacados de la semana"
            name: "highlights"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Tipo", name: "type", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Fecha o hito", name: "date", widget: "string" }
              - label: "Estado"
                name: "status"
                widget: "select"
                options:
                  - "En control"
                  - "En construcción"
                  - "Publicado como visualización"
                  - "Pendiente de validación institucional"
              - { label: "Texto", name: "text", widget: "text" }
          - label: "Próximas acciones"
            name: "nextActions"
            widget: "list"
            allow_add: true

  - name: "compromisos"
    label: "Compromisos de Junta Directiva"
    description: >-
      Matriz de compromisos por acta (panel "Compromisos" del tablero de
      Junta Directiva). Los totales, conteos por estado, por prioridad y
      por acta que se ven en ese tablero se calculan automáticamente a
      partir de esta matriz al guardar — no hay que editarlos aparte ni
      mantenerlos sincronizados a mano.
    files:
      - file: "assets/data/junta-compromisos.json"
        label: "Matriz de compromisos"
        name: "compromisos"
        fields:
          - { label: "Actualizado al (AAAA-MM-DD)", name: "updatedAt", widget: "string" }
          - { label: "Fuente", name: "sourceLabel", widget: "string" }
          - { label: "Alcance (actas cubiertas)", name: "scopeLabel", widget: "string" }
          - label: "Aviso de confidencialidad"
            name: "securityLabel"
            widget: "text"
          - label: "Matriz de compromisos"
            name: "matrix"
            widget: "list"
            summary: "{{id}} — {{acta}} — {{estado}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Acta", name: "acta", widget: "string" }
              - label: "Fecha del acta (AAAA-MM-DD)"
                name: "fecha"
                widget: "string"
              - { label: "Categoría", name: "categoria", widget: "string" }
              - label: "Prioridad"
                name: "prioridad"
                widget: "select"
                options: ["Crítica", "Alta", "Media", "Baja"]
              - label: "Estado"
                name: "estado"
                widget: "select"
                options: ["Pendiente", "En curso", "Cumplido", "Cancelado", "Seguimiento recurrente"]
              - label: "Plazo (AAAA-MM-DD, dejar vacío si no aplica)"
                name: "plazo"
                widget: "string"
                required: false
                default: ""
          - label: "Cómo leer este panel"
            name: "reading"
            widget: "list"
            allow_add: true

  - name: "documentos"
    label: "Listado Maestro (Gestión Documental)"
    description: >-
      Matriz del Listado Maestro de Control de Información Documentada
      (GPCIFT001). Alimenta la sección "Gestión Documental del MOP": el
      catálogo público, sus indicadores (total, vigentes, en
      construcción...) y el resumen por tipo documental se calculan
      automáticamente a partir de esta matriz al guardar. Para dar de
      baja una versión y publicar la siguiente, cambia el Estado del
      registro anterior a "Obsoleto" y agrega un nuevo registro con el
      mismo código y la versión nueva. IMPORTANTE: este repositorio es
      público, así que aquí NUNCA se guarda el link real del documento
      — solo su metadata (proceso, código, nombre, versión, estado,
      dependencia). El documento y su enlace se consultan por el canal
      interno autorizado.
    files:
      - file: "assets/data/documentos-mop.json"
        label: "Listado Maestro"
        name: "documentos"
        fields:
          - { label: "Fuente", name: "fuente", widget: "string" }
          - label: "Hoja de origen"
            name: "hojaListado"
            widget: "string"
            required: false
          - label: "Hoja de resumen"
            name: "hojaResumen"
            widget: "string"
            required: false
          - { label: "Fecha de extracción (AAAA-MM-DD)", name: "fechaExtraccion", widget: "string" }
          - label: "Documentos"
            name: "documentos"
            widget: "list"
            summary: "{{codigo}} — {{nombre}} ({{estado}})"
            fields:
              - label: "Macroproceso"
                name: "macroproceso"
                widget: "select"
                options: ["Estratégico", "Gobernanza", "Misional", "Apoyo", "Aseguramiento independiente"]
              - { label: "Proceso", name: "proceso", widget: "string" }
              - { label: "Subproceso", name: "subproceso", widget: "string", required: false }
              - label: "Tipo documental"
                name: "tipoDocumental"
                widget: "select"
                options: ["Política", "Plan", "Programa", "Sistema", "Anexo", "Caracterización", "Manual", "Procedimiento", "Guía", "Formato", "Matriz", "Instructivo", "Acta", "Informe", "Estatuto", "Reglamento", "Video"]
              - label: "Descripción temática (palabras clave para búsqueda)"
                name: "descripcionTematica"
                widget: "text"
                required: false
              - { label: "Código del documento", name: "codigo", widget: "string" }
              - { label: "Nombre del documento", name: "nombre", widget: "string" }
              - label: "Fecha de aprobación (AAAA-MM-DD, dejar vacío si no aplica)"
                name: "fechaAprobacion"
                widget: "string"
                required: false
                default: ""
              - { label: "Año", name: "anio", widget: "string", required: false }
              - { label: "Versión", name: "version", widget: "string", required: false }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options: ["Vigente", "En revisión", "En construcción", "En actualización", "Obsoleto"]
              - { label: "Dependencia", name: "dependencia", widget: "string", required: false }
              - { label: "Soporte", name: "soporte", widget: "string", required: false }
              - label: "Observaciones"
                name: "observaciones"
                widget: "text"
                required: false
              - label: "Clasificación"
                name: "clasificacion"
                widget: "select"
                options: ["Interna", "Pública"]
                default: "Interna"

  - name: "gobernanza"
    label: "Gobernanza y Propósito"
    description: >-
      Contenido del anillo de Gobernanza y Propósito (panel "Gobernanza"
      del mapa). Los títulos de sección y la estructura de la página no
      se editan aquí — solo los textos, la lista de actores y los pasos
      del ciclo de decisión.
    files:
      - file: "assets/data/gobernanza-panel.json"
        label: "Panel de Gobernanza"
        name: "gobernanza"
        fields:
          - label: "Párrafos de introducción"
            name: "intro"
            widget: "list"
            allow_add: true
            field: { label: "Párrafo", name: "parrafo", widget: "text" }
          - label: "Instancias, responsables y actores relacionados"
            name: "actores"
            widget: "list"
            summary: "{{nombre}}"
            fields:
              - label: "Tipo de actor"
                name: "tipo"
                widget: "string"
                hint: "Por ejemplo: Responsable interno, Instancia interna, Actor territorial, Actor externo."
              - label: "¿Es un actor externo a la Fundación?"
                name: "externo"
                widget: "boolean"
                default: false
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
              - label: "Texto del enlace (opcional)"
                name: "enlaceTexto"
                widget: "string"
                required: false
                default: ""
              - label: "URL del enlace (opcional)"
                name: "enlaceUrl"
                widget: "string"
                required: false
                default: ""
          - label: "Cómo se gobierna una decisión (pasos del ciclo)"
            name: "cicloPasos"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Paso", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Aporte a la Ruta 2030"
            name: "aporteRuta2030"
            widget: "text"

  - name: "misional"
    label: "Macroproceso Misional"
    description: >-
      Contenido del anillo Misional (panel "Misional" del mapa). Los
      títulos de sección y la estructura de la página no se editan
      aquí — solo los textos, la lista de procesos y capacidades, y
      los pasos del ciclo de trabajo.
    files:
      - file: "assets/data/misional-panel.json"
        label: "Panel Misional"
        name: "misional"
        fields:
          - label: "Párrafos de introducción"
            name: "intro"
            widget: "list"
            allow_add: true
            field: { label: "Párrafo", name: "parrafo", widget: "text" }
          - label: "Procesos y capacidades misionales"
            name: "procesos"
            widget: "list"
            summary: "{{nombre}}"
            fields:
              - label: "¿Destacar este proceso?"
                name: "destacado"
                widget: "boolean"
                default: false
                hint: "Le da un estilo visual resaltado en la lista (úsalo para el proceso más central, hoy la STP)."
              - { label: "Nombre del proceso o capacidad", name: "nombre", widget: "string" }
              - label: "Línea secundaria (responsable, articulación o tipo de capacidad)"
                name: "lineaSecundaria"
                widget: "string"
                hint: "Por ejemplo: 'Responsable institucional: ...', 'Responsables: ...', 'Articulación institucional: ...', o una frase que describa el tipo de capacidad."
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Cómo una prioridad se convierte en resultado territorial (pasos del ciclo)"
            name: "cicloPasos"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Paso", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Aporte a la Ruta 2030"
            name: "aporteRuta2030"
            widget: "text"

  - name: "apoyo"
    label: "Macroproceso de Apoyo"
    description: >-
      Contenido del anillo de Apoyo (panel "Apoyo" del mapa). Los
      títulos de sección y la estructura de la página no se editan
      aquí — solo los textos, la lista de dependencias y los pasos
      del ciclo de servicio interno. La sección "Actualizaciones
      documentales recientes" (con los códigos de instrumentos
      protegidos) NO está aquí a propósito: esos códigos los verifica
      automáticamente la validación del sitio y no deben editarse
      desde este formulario.
    files:
      - file: "assets/data/apoyo-panel.json"
        label: "Panel de Apoyo"
        name: "apoyo"
        fields:
          - label: "Párrafos de introducción"
            name: "intro"
            widget: "list"
            allow_add: true
            field: { label: "Párrafo", name: "parrafo", widget: "text" }
          - label: "Dependencias del Macroproceso de Apoyo"
            name: "dependencias"
            widget: "list"
            summary: "{{nombre}}"
            fields:
              - label: "¿Destacar esta dependencia?"
                name: "destacado"
                widget: "boolean"
                default: false
                hint: "Le da un estilo visual resaltado en la lista (úsalo para la dependencia articuladora, hoy la SDE)."
              - { label: "Nombre de la dependencia", name: "nombre", widget: "string" }
              - label: "Línea secundaria (responsable institucional o rol)"
                name: "lineaSecundaria"
                widget: "string"
                hint: "Por ejemplo: 'Responsable institucional: ...' o una frase que describa su rol dentro del macroproceso."
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Cómo se habilita la operación (pasos del ciclo)"
            name: "cicloPasos"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Paso", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Aporte a la Ruta 2030"
            name: "aporteRuta2030"
            widget: "text"

  - name: "aseguramiento"
    label: "Aseguramiento Independiente"
    description: >-
      Contenido del anillo de Aseguramiento Independiente (panel
      "Aseguramiento Independiente" del mapa). Los títulos de sección
      y la estructura de la página no se editan aquí. Tampoco están
      aquí, a propósito: la nota de instrumentos controlados ni la
      sección "Instrumentos que gobiernan el ciclo" — contienen los
      códigos FGA-AIN-CR-01, FGA-AIN-PR-01 y FGA-AIN-MT-01, que la
      validación automática del sitio verifica textualmente y no deben
      editarse desde este formulario. Las listas de auditorías por
      vigencia (proyectos y donantes, revisoría fiscal, planes de
      mejoramiento) tampoco están aquí: se generan con otro mecanismo
      ya existente en el sitio, independiente de este CMS.
    files:
      - file: "assets/data/aseguramiento-panel.json"
        label: "Panel de Aseguramiento Independiente"
        name: "aseguramiento"
        fields:
          - label: "Párrafos de introducción"
            name: "intro"
            widget: "list"
            allow_add: true
            field: { label: "Párrafo", name: "parrafo", widget: "text" }
          - label: "Componentes del aseguramiento independiente"
            name: "componentes"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Etiqueta", name: "etiqueta", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Cómo fluye una revisión independiente (pasos)"
            name: "flujoPasos"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Paso", name: "titulo", widget: "string" }
              - label: "Descripción"
                name: "descripcion"
                widget: "text"
                hint: "Se muestra como '<Paso>: <Descripción>' — empieza en minúscula, como en los pasos actuales."
