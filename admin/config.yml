# Configuración de Decap CMS — Fase 2 de la auditoría del módulo
# administrador del MOP (agosto 2026).
#
# Este archivo define QUÉ es editable desde /admin. Cada colección
# apunta a un archivo JSON en assets/data/; al guardar, Decap hace un
# commit directo a ese JSON, y el flujo
# .github/workflows/generar-datos-cms.yml regenera automáticamente el
# .js que el sitio realmente carga (ver tools/build-cms-data.js).
#
# base_url debe apuntar al pequeño servidor de autenticación que TI
# despliega siguiendo admin/README.md — sin eso, el botón de acceso no
# funciona. Con base_url vacío, Decap muestra un error claro en vez de
# fallar en silencio.

backend:
  name: github
  repo: ivanbernal-dev/mop-gaia-amazonas
  branch: main
  base_url: "https://mop-gaia-oauth.ivan-bernal.workers.dev"
  auth_endpoint: auth

# Antes de publicar, cada cambio queda como borrador visible solo para
# quien lo hizo, hasta que alguien con permiso lo aprueba — así ningún
# cambio llega al sitio público sin revisión.
publish_mode: editorial_workflow

media_folder: "assets/cms-uploads"
public_folder: "/assets/cms-uploads"

collections:
  - name: "novedades"
    label: "Novedades del MOP"
    description: "Lo que se muestra en la sección 'Esta semana en el MOP'."
    files:
      - file: "assets/data/mop-updates.json"
        label: "Novedades semanales"
        name: "novedades"
        fields:
          - label: "Semana actual"
            name: "currentWeek"
            widget: "object"
            fields:
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "Periodo", name: "period", widget: "string" }
              - { label: "Resumen", name: "summary", widget: "text" }
          - label: "Destacados de la semana"
            name: "highlights"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Tipo", name: "type", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Fecha o hito", name: "date", widget: "string" }
              - label: "Estado"
                name: "status"
                widget: "select"
                options:
                  - "En control"
                  - "En construcción"
                  - "Publicado como visualización"
                  - "Pendiente de validación institucional"
              - { label: "Texto", name: "text", widget: "text" }
          - label: "Próximas acciones"
            name: "nextActions"
            widget: "list"
            allow_add: true

  - name: "gobernanza"
    label: "Gobernanza y Propósito"
    description: >-
      Contenido del anillo de Gobernanza y Propósito (panel "Gobernanza"
      del mapa). Los títulos de sección y la estructura de la página no
      se editan aquí — solo los textos, la lista de actores y los pasos
      del ciclo de decisión.
    files:
      - file: "assets/data/gobernanza-panel.json"
        label: "Panel de Gobernanza"
        name: "gobernanza"
        fields:
          - label: "Párrafos de introducción"
            name: "intro"
            widget: "list"
            allow_add: true
            field: { label: "Párrafo", name: "parrafo", widget: "text" }
          - label: "Instancias, responsables y actores relacionados"
            name: "actores"
            widget: "list"
            summary: "{{nombre}}"
            fields:
              - label: "Tipo de actor"
                name: "tipo"
                widget: "string"
                hint: "Por ejemplo: Responsable interno, Instancia interna, Actor territorial, Actor externo."
              - label: "¿Es un actor externo a la Fundación?"
                name: "externo"
                widget: "boolean"
                default: false
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
              - label: "Texto del enlace (opcional)"
                name: "enlaceTexto"
                widget: "string"
                required: false
                default: ""
              - label: "URL del enlace (opcional)"
                name: "enlaceUrl"
                widget: "string"
                required: false
                default: ""
          - label: "Cómo se gobierna una decisión (pasos del ciclo)"
            name: "cicloPasos"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Paso", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Aporte a la Ruta 2030"
            name: "aporteRuta2030"
            widget: "text"

  - name: "misional"
    label: "Macroproceso Misional"
    description: >-
      Contenido del anillo Misional (panel "Misional" del mapa). Los
      títulos de sección y la estructura de la página no se editan
      aquí — solo los textos, la lista de procesos y capacidades, y
      los pasos del ciclo de trabajo.
    files:
      - file: "assets/data/misional-panel.json"
        label: "Panel Misional"
        name: "misional"
        fields:
          - label: "Párrafos de introducción"
            name: "intro"
            widget: "list"
            allow_add: true
            field: { label: "Párrafo", name: "parrafo", widget: "text" }
          - label: "Procesos y capacidades misionales"
            name: "procesos"
            widget: "list"
            summary: "{{nombre}}"
            fields:
              - label: "¿Destacar este proceso?"
                name: "destacado"
                widget: "boolean"
                default: false
                hint: "Le da un estilo visual resaltado en la lista (úsalo para el proceso más central, hoy la STP)."
              - { label: "Nombre del proceso o capacidad", name: "nombre", widget: "string" }
              - label: "Línea secundaria (responsable, articulación o tipo de capacidad)"
                name: "lineaSecundaria"
                widget: "string"
                hint: "Por ejemplo: 'Responsable institucional: ...', 'Responsables: ...', 'Articulación institucional: ...', o una frase que describa el tipo de capacidad."
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Cómo una prioridad se convierte en resultado territorial (pasos del ciclo)"
            name: "cicloPasos"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Paso", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Aporte a la Ruta 2030"
            name: "aporteRuta2030"
            widget: "text"

  - name: "apoyo"
    label: "Macroproceso de Apoyo"
    description: >-
      Contenido del anillo de Apoyo (panel "Apoyo" del mapa). Los
      títulos de sección y la estructura de la página no se editan
      aquí — solo los textos, la lista de dependencias y los pasos
      del ciclo de servicio interno. La sección "Actualizaciones
      documentales recientes" (con los códigos de instrumentos
      protegidos) NO está aquí a propósito: esos códigos los verifica
      automáticamente la validación del sitio y no deben editarse
      desde este formulario.
    files:
      - file: "assets/data/apoyo-panel.json"
        label: "Panel de Apoyo"
        name: "apoyo"
        fields:
          - label: "Párrafos de introducción"
            name: "intro"
            widget: "list"
            allow_add: true
            field: { label: "Párrafo", name: "parrafo", widget: "text" }
          - label: "Dependencias del Macroproceso de Apoyo"
            name: "dependencias"
            widget: "list"
            summary: "{{nombre}}"
            fields:
              - label: "¿Destacar esta dependencia?"
                name: "destacado"
                widget: "boolean"
                default: false
                hint: "Le da un estilo visual resaltado en la lista (úsalo para la dependencia articuladora, hoy la SDE)."
              - { label: "Nombre de la dependencia", name: "nombre", widget: "string" }
              - label: "Línea secundaria (responsable institucional o rol)"
                name: "lineaSecundaria"
                widget: "string"
                hint: "Por ejemplo: 'Responsable institucional: ...' o una frase que describa su rol dentro del macroproceso."
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Cómo se habilita la operación (pasos del ciclo)"
            name: "cicloPasos"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Paso", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Aporte a la Ruta 2030"
            name: "aporteRuta2030"
            widget: "text"

  - name: "aseguramiento"
    label: "Aseguramiento Independiente"
    description: >-
      Contenido del anillo de Aseguramiento Independiente (panel
      "Aseguramiento Independiente" del mapa). Los títulos de sección
      y la estructura de la página no se editan aquí. Tampoco están
      aquí, a propósito: la nota de instrumentos controlados ni la
      sección "Instrumentos que gobiernan el ciclo" — contienen los
      códigos FGA-AIN-CR-01, FGA-AIN-PR-01 y FGA-AIN-MT-01, que la
      validación automática del sitio verifica textualmente y no deben
      editarse desde este formulario. Las listas de auditorías por
      vigencia (proyectos y donantes, revisoría fiscal, planes de
      mejoramiento) tampoco están aquí: se generan con otro mecanismo
      ya existente en el sitio, independiente de este CMS.
    files:
      - file: "assets/data/aseguramiento-panel.json"
        label: "Panel de Aseguramiento Independiente"
        name: "aseguramiento"
        fields:
          - label: "Párrafos de introducción"
            name: "intro"
            widget: "list"
            allow_add: true
            field: { label: "Párrafo", name: "parrafo", widget: "text" }
          - label: "Componentes del aseguramiento independiente"
            name: "componentes"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Etiqueta", name: "etiqueta", widget: "string" }
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descripción", name: "descripcion", widget: "text" }
          - label: "Cómo fluye una revisión independiente (pasos)"
            name: "flujoPasos"
            widget: "list"
            summary: "{{titulo}}"
            fields:
              - { label: "Paso", name: "titulo", widget: "string" }
              - label: "Descripción"
                name: "descripcion"
                widget: "text"
                hint: "Se muestra como '<Paso>: <Descripción>' — empieza en minúscula, como en los pasos actuales."
